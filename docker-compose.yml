version: '3.9'

networks:
  smart-finance-ai-network:
    driver: bridge
    
# docker compose up -d db-service
services:
  db-service:
    container_name: mysql-smart-finance-ai
    image: mysql:latest
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}

# docker compose up -d ml-service
  ml-service:
    container_name: ml-service
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OCI_STORAGE_BUCKET=finance-ai-bucket
    networks:
      - finance-network

# docker compose up -d backend-service
  backend-service:
    container_name: backend-service
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - ml-service
      - db-service
    networks:
      - smart-finance-ai-network

