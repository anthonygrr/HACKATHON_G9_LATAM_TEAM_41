# Render Blueprint - infraestructura de staging (sin frontend)
# Backend Spring Boot (Docker, Java 17) + ML Service (Python/FastAPI).
# MySQL gestionado externamente en Aiven (public cloud, conexion con SSL).

services:
  # ------------------------------------------------------------------
  # ML Service (Python/FastAPI) - puerto 10000
  # ------------------------------------------------------------------
  - type: web
    name: financeai-ml-service
    env: python
    region: oregon
    plan: free
    rootDir: data-science/ml-api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: 3.11.9

  # ------------------------------------------------------------------
  # Backend (Docker/Spring Boot) - usa el Dockerfile en la raiz
  # ------------------------------------------------------------------
  - type: web
    name: financeai-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://finance-db-mysql-finance-ai-project.k.aivencloud.com:28083/defaultdb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: ML_SERVICE_URL
        value: http://financeai-ml-service:10000
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false