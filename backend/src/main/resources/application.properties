spring.application.name=SmartAssistantFinanceAILatamG9Team41

# ENV CONFIGURATION
# Se resuelve relativo al directorio de trabajo del proceso.
# './' permite levantar la app tanto desde la raiz del repo (IntelliJ) como desde backend/ (Maven):
# ambas ubicaciones cuentan con .env con el mismo contenido.
springdotenv.directory=../
springdotenv.filename=.env
springdotenv.ignoreIfMissing=true
springdotenv.overrideSystemEnvironment=true

# DATASOURCE CONFIGURATION
spring.datasource.url=${DB_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# LOGGING
logging.level.root=INFO
#logging.level.smart.finance=DEBUG
#logging.level.org.springframework=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SPRING SECURITY CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=${JWT_ISSUER:finance-ai}

# RATE LIMITING
app.rate-limit.signin.max-requests=${RATE_LIMIT_SIGNIN_MAX:5}
app.rate-limit.signin.period-secs=${RATE_LIMIT_SIGNIN_PERIOD:60}
app.rate-limit.signup.max-requests=${RATE_LIMIT_SIGNUP_MAX:5}
app.rate-limit.signup.period-secs=${RATE_LIMIT_SIGNUP_PERIOD:300}

# SWAGGER / OPENAPI
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha

# MACHINE LEARNING CONFIGURATION
ml.service.base-url=${ML_SERVICE_URL}
ml.service.api-key=${ML_API_KEY:}
ml.service.timeout-ms=${ML_TIMEOUT_MS:5000}

