spring.application.name=SmartAssistantFinanceAILatamG9Team41

# ENV CONFIGURATION
dotenv.system.env.file=../.env

# spring.datasource.url=jdbc:mysql://db-service:3306/${MYSQL_DB}
# spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DB}?useSSL=false&serverTimezone=UTC

# DATASOURCE CONFIGURATION
spring.datasource.url=${DB_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY CONFIGURATION
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MACHINE LEARNING CONFIGURATION
ml.service.url=${ML_SERVICE_URL}

